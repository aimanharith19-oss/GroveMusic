name: Build APK
on: [push, workflow_dispatch]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env: { ANDROID_HOME: /usr/local/lib/android/sdk }
      - run: cp app/build/outputs/apk/release/*.apk GroveMusic.apk
      - uses: actions/upload-artifact@v4
        with: { name: GroveMusic-apk, path: GroveMusic.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grove Music build ${{ github.run_number }}
          files: GroveMusic.apk
