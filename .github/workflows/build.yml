name: Build GroveMedia
on: [push, workflow_dispatch]
permissions: { contents: write }
concurrency: { group: build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew assembleFoss --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=5
      - run: cp $(ls app/build/outputs/apk/foss/*arm64*.apk | head -1) GroveMedia.apk
      - uses: actions/upload-artifact@v4
        with: { name: GroveMedia-apk, path: GroveMedia.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GroveMedia build ${{ github.run_number }}
          files: GroveMedia.apk
